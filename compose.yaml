services:
  caddy:
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    container_name: rpm-caddy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    networks:
      - web

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: rpm-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - web

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: rpm-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LOCAL_PAPERS_PATH=${LOCAL_PAPERS_PATH}
      - LOCAL_NOTES_PATH=${LOCAL_NOTES_PATH}
      - CROSSREF_MAILTO=${CROSSREF_MAILTO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,*.ts.net}
    volumes:
      - ./data/research-manager/logs:/data/research-manager/logs
      - ${HOST_PAPERS_PATH:-./Paper}:/workspace/Paper
      - ${HOST_NOTES_PATH:-./Memo}:/workspace/Memo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - web
      - database

  postgres:
    image: postgres:17
    container_name: rpm-postgres
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./data/research-manager/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - database

networks:
  web:
  database:
    internal: true
